, Produktportfolio-Management."},{title:"Business-Analyse und industrielle Informationssysteme",body:"Neugestaltung von Produktionssteuerungs-Applikationen, Entscheidungssystemen für Fahrzeugqualität, S&OP-Planung — Oracle, SQL, Power BI."},{title:"Qualität, Methoden und Problemlösung",body:"ISO 9002, FMEA, 8D, A3, PSW-PPAP, IMDS — solide Industriekultur, vom Fertigungsprozess bis zur Qualitätskontrolle."}]},realisations:{title:"Wichtige Erfolge",intro:"Vier repräsentative Projekte, ausgewählt nach Wirkung und bereichsübergreifendem Anspruch.",items:[{challenge:"ERP-Cutover — General Electric Vernova",context:"Umstellung der digitalen Daten-Konsolidierungskette (vom Bestand bis zur Konzernkonsolidierung) an einem durchgängig betriebenen Energie-Industriestandort.",action:"Detaillierter Cutover-Plan, Moderation der Steering Committees, Koordination Fachbereich/IT/Produktion/Logistik/Finanzen, Notfallpläne und Incident-Management.",result:"Cutover mit einer nicht blockierenden Verzögerung von zwei Tagen umgesetzt; Stabilisierungsphase ohne Produktionsunterbrechung abgeschlossen."},{challenge:"Leitung eines internationalen F&E-Teams — Stellantis",context:"Portfolio-Steuerung der Produkte Touchscreen und Head-Up Display für die Konzernfahrzeuge; Team auf mehrere Länder verteilt.",action:"Hierarchische Führung von zehn Projektleitern, APQP-Coaching, Verhandlung von Serienänderungen, Überwachung von Kundenreklamationen.",result:"Achtundzwanzig Produkte über fünf Jahre entwickelt und industrialisiert, unter Einhaltung der QKL-Ziele und mit messbarem Kompetenzaufbau im Team."},{challenge:"Neugestaltung der Produktionssteuerungs-Applikationen — Stellantis",context:"Mehrere historisch gewachsene, heterogene Applikationen zur Liniensteuerung mit hohen Wartungs- und Weiterentwicklungskosten.",action:"Leitung der Migration in eine einzige übergreifende Web-Anwendung, Business-Analyse, Change-Management, strikte Meilensteinsteuerung zum Schutz der Produktion.",result:"Migration ohne jeden Produktionsausfall auf den betroffenen Linien; einheitliche technische Basis für künftige Weiterentwicklungen."},{challenge:"Entscheidungssystem Fahrzeugqualität — Stellantis",context:"Fehlende übergreifende, quantifizierte Sicht auf die Fahrzeugqualität auf Standortebene, was Korrekturentscheidungen verzögerte.",action:"Konzeption und Umsetzung eines Entscheidungssystems auf Oracle / SQL / PL-SQL: Datenmodell, Ladeflüsse, übergreifende Kennzahlen.",result:"Bereitstellung eines gemeinsamen KPI-Referenzsystems für Qualität und Produktion, das Entscheidungen zur kontinuierlichen Verbesserung über mehr als ein Jahrzehnt unterstützt."}]},parcours:{title:"Beruflicher Werdegang",current:"Aktuelles Mandat",detailed:[{period:"05/2025 — 06/2026",company:"General Electric Vernova",role:"Cutover Leader (Berater)",location:"Bourogne (90), Frankreich",bullets:["Leitung des ERP-Cutovers für die digitale Daten-Konsolidierungskette.","Bereichsübergreifende Koordination von Fachbereich, IT, Produktion, Logistik und Finanzen.","Moderation der Steering Committees, Notfallpläne, Incident-Management.","Stabilisierung nach Go-Live und Formalisierung der Lessons Learned."]},{period:"02/2020 — 03/2025",company:"Stellantis",role:"F&E-Teamleiter",location:"Sochaux, Frankreich",bullets:["Hierarchische Führung eines internationalen Teams von zehn Projektleitern.","Steuerung der Entwicklung von 28 Produkten Touchscreen und Head-Up Display.","APQP-Coaching, Verhandlung von Serienänderungen, Überwachung der Kundenreklamationen.","Absicherung der QKL-Verpflichtungen über das gesamte Portfolio."]},{period:"08/2015 — 01/2020",company:"Stellantis",role:"Projektleiter — Mechatronik",location:"Sochaux, Frankreich",bullets:["Steuerung innovativer Projekte Touchscreen, Lamellen- und Windschutzscheiben-HUD.","Umsetzung von APQP, PLM, FMEA, eBOM, IMDS, PSW-PPAP.","Schnittstelle zu Industrialisierung, Qualität und Lieferanten."]},{period:"01/2013 — 07/2015",company:"Stellantis",role:"IT-Projektleiter — Supply Chain",location:"Sochaux, Frankreich",bullets:["Aufbau einer Anwendung zur mittel- und langfristigen Produktionsplanung.","Business-Analyse, Agile-Methodik, S&OP, MPS, Erstellung von User Stories.","Steuerung der Rollouts und Change-Management."]}],earlyTitle:"Frühere Stationen (1995 — 2013)",earlyBody:"Von 2000 bis 2013 IT-Projektleiter bei Stellantis (Sochaux) — zunächst Produktion, dann Fahrzeugqualität: Neugestaltung der Linien-Steuerungsanwendungen in eine übergreifende Web-Anwendung (Migration ohne Produktionsausfall) und Aufbau eines Entscheidungssystems Fahrzeugqualität auf Oracle / SQL / PL-SQL. Davor von 1995 bis 2000 Qualitätsverantwortlicher bei Grandjean SA (Sainte-Suzanne): Aufbau und Einführung des ISO-9002-Qualitätssystems."},formation:{title:"Ausbildung und Entwicklung",items:[{year:"1991 — 1994",title:"Diplom-Ingenieur Maschinenbau",org:"Université de Technologie de Compiègne — Campus Sévenans (Belfort)"}],devTitle:"Kontinuierliche berufliche Weiterbildung",devBody:"APQP-, Agile- und V-Modell-Methoden in aufeinanderfolgenden Mandaten angewandt; regelmäßige Praxis der Problemlösung (8D, A3, FMEA); PLM-, Power-BI- und Oracle/SQL-Tools; Change-Management bei ERP-Migrationen und der Neugestaltung industrieller Anwendungen."},mobility:{title:"Sprachen und Mobilität",intro:"Verfügbar ab dem 1. Juli 2026 — Beschäftigungsraum Belfort / Montbéliard, erweitert auf eine realistische einstündige Fahrt rund um Montbéliard.",languagesTitle:"Sprachen",languages:[{name:"Französisch",level:"Muttersprache"},{name:"Englisch",level:"B2 — beruflich"}],zoneTitle:"Mobilitätszone",zoneBody:"Eine einstündige Autofahrt rund um Montbéliard deckt die Räume Belfort, Mulhouse, Besançon, Vesoul, den Norden des Doubs, den Süden der Vogesen und des Elsass sowie die nahe Schweizer Grenze ab.",swissTitle:"Offen für die Schweiz",swissBody:"Offen für Möglichkeiten in der Schweiz — Kanton Jura, Basel-Stadt und Basel-Landschaft. Berechtigung zum Status als Grenzgänger.",ava
